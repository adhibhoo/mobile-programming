<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>
    <h1>Calculator</h1>
    <input type="number" id="n1" placeholder="Number 1">
    <input type="number" id="n2" placeholder="Number 2">
    <button type="button" onclick="calculate('+')">Add</button>
    <button type="button" onclick="calculate('-')">Subtract</button>
    <button type="button" onclick="calculate('*')">Multiply</button>
    <button type="button" onclick="calculate('/')">Divide</button>
    <p id="result"></p>
    <script src="calScript.js"></script>
</body>

</html>
